<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">职场吐槽翻译</title>
  <desc id="desc">把直白吐槽转换成第一人称 LinkedIn 职业叙事</desc>
  <rect width="1200" height="760" fill="#e5e1d7"/>
  <rect x="46" y="42" width="1108" height="676" fill="#f8f5ed" stroke="#bbb7ad" stroke-width="2"/>
  <text x="82" y="103" font-family="monospace" font-size="14" letter-spacing="3" fill="#db6b53">LINKEDIN SPEAK / TRANSLATOR</text>
  <text x="82" y="174" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#202522">把真心话，翻译成能发在群里的话。</text>
  <rect x="82" y="236" width="440" height="344" rx="7" fill="#202522"/>
  <text x="116" y="286" font-family="monospace" font-size="14" letter-spacing="2" fill="#f0b13c">RAW THOUGHT</text>
  <text x="116" y="372" font-family="Arial, sans-serif" font-size="31" fill="#fffdf8">“这个项目纯垃圾，</text>
  <text x="116" y="422" font-family="Arial, sans-serif" font-size="31" fill="#fffdf8">谁爱做谁做。”</text>
  <path d="M552 410h62" stroke="#db6b53" stroke-width="6"/>
  <path d="m600 392 20 18-20 18" fill="none" stroke="#db6b53" stroke-width="6"/>
  <rect x="650" y="236" width="468" height="344" rx="7" fill="#dceae4" stroke="#b9cec5"/>
  <text x="684" y="286" font-family="monospace" font-size="14" letter-spacing="2" fill="#2f817c">LINKEDIN VERSION</text>
  <text x="684" y="354" font-family="Arial, sans-serif" font-size="25" fill="#202522">我决定主动重新配置精力，</text>
  <text x="684" y="397" font-family="Arial, sans-serif" font-size="25" fill="#202522">把机会留给更能形成战略</text>
  <text x="684" y="440" font-family="Arial, sans-serif" font-size="25" fill="#202522">共振的伙伴。</text>
  <text x="684" y="522" font-family="monospace" font-size="16" fill="#2f817c">#StrategicAlignment</text>
