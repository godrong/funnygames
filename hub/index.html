<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d2420" />
    <meta name="description" content="FunnyGames：小而有趣的实验游戏合集" />
    <title>FunnyGames · 游戏实验室</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="FunnyGames 首页">
        <span class="brand-mark" aria-hidden="true">F</span>
        <span><strong>FunnyGames</strong><small>PLAYGROUND / 001</small></span>
      </a>
      <nav aria-label="主导航">
        <a class="active" href="#games">游戏</a>
        <a href="https://github.com/godrong/funnygames">GitHub</a>
      </nav>
      <span class="status"><i></i> 1 GAME ONLINE</span>
    </header>

    <main>
      <section class="catalog" id="games">
        <div class="catalog-heading">
          <div><span>GAME CATALOG</span><h1>今天玩点什么？</h1></div>
          <p>收集那些规则简单、想法奇怪、可以马上开始的小游戏。</p>
        </div>

        <article class="featured-game">
          <a class="game-cover" href="./blind-soup/" aria-label="打开盲汤">
            <img src="./assets/blind-soup-cover.svg" alt="盲汤的线索关系画布预览" />
          </a>
          <div class="game-info">
            <div class="game-index">GAME / 001</div>
            <h2>盲汤</h2>
            <p>拖动物件、人物、场景和异常条件，让大模型生成一道海龟汤。你可以亲自推理，也可以让不同模型进场破案，比较谁更聪明。</p>
            <div class="game-tags"><span>推理解谜</span><span>AI 生成</span><span>模型竞技</span></div>
            <a class="launch-button" href="./blind-soup/">
              开始游戏
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" /></svg>
            </a>
          </div>
        </article>

        <div class="next-slot">
          <span>GAME / 002</span>
          <strong>下一场实验正在准备</strong>
          <i>COMING SOON</i>
        </div>
      </section>
    </main>

    <footer><span>FUNNYGAMES LAB</span><span>MADE FOR CURIOUS MINDS</span></footer>
  </body>
</html>
